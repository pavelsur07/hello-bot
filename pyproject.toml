[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-bot"
version = "0.1.0"
description = "Modular customer chat bot scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["packages"]
include = ["hello_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
